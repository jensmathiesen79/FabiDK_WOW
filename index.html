<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fabi - WoW Armory Dashboard</title>
  <style>
    :root {
      --bg-base: #0b0c10;
      --panel-bg: rgba(21, 23, 30, 0.85);
      --border-color: #2a2e39;
      --gold: #f8b700;
      --text-main: #e0e0e0;
      --text-muted: #8b92a5;
      
      /* WoW Quality Colors */
      --q-epic: #a335ee;
      --q-rare: #0070dd;
      --q-uncommon: #1eff00;
      --q-common: #ffffff;
      --q-poor: #9d9d9d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: radial-gradient(circle at center top, #1a2133 0%, var(--bg-base) 80%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    /* Top Header */
    .armory-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .armory-header h1 {
      font-size: 3rem;
      color: var(--gold);
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      margin-bottom: 5px;
      letter-spacing: 1px;
    }

    .armory-header h2 {
      font-size: 1.1rem;
      color: var(--text-main);
      font-weight: 400;
    }

    .armory-header .guild {
      color: #b38b38;
      font-style: italic;
    }

    /* Main Armory Layout */
    .armory-grid {
      display: grid;
      grid-template-columns: 280px minmax(450px, 550px) 280px;
      gap: 30px;
      width: 100%;
      max-width: 1250px;
    }

    @media (max-width: 1050px) {
      .armory-grid {
        grid-template-columns: 1fr;
      }
      .gear-left .gear-item {
        flex-direction: row-reverse !important;
        text-align: left !important;
      }
    }

    /* Gear Columns */
    .gear-col {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .gear-bottom {
      grid-column: 1 / -1;
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 10px;
    }

    /* Gear Items */
    .gear-item {
      display: flex;
      align-items: center;
      gap: 15px;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: background 0.2s;
      min-height: 64px;
    }

    .gear-item:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .gear-left .gear-item {
      flex-direction: row;
      text-align: right;
    }

    .gear-right .gear-item, .gear-bottom .gear-item {
      flex-direction: row-reverse;
      text-align: left;
    }

    .gear-icon {
      width: 50px;
      height: 50px;
      background: #111;
      border: 2px solid var(--q-common);
      border-radius: 4px;
      flex-shrink: 0;
      box-shadow: 0 0 8px rgba(0,0,0,0.8);
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50"><rect width="50" height="50" fill="%23222"/><text x="50%" y="50%" fill="%23555" font-size="20" text-anchor="middle" dominant-baseline="middle">?</text></svg>');
      background-size: cover;
    }

    .gear-info {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .gear-name {
      font-weight: 600;
      font-size: 0.95rem;
      text-shadow: 1px 1px 2px #000;
    }

    .gear-slot {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* Quality Colors */
    .epic .gear-icon { border-color: var(--q-epic); }
    .epic .gear-name { color: var(--q-epic); }
    .rare .gear-icon { border-color: var(--q-rare); }
    .rare .gear-name { color: var(--q-rare); }
    .uncommon .gear-icon { border-color: var(--q-uncommon); }
    .uncommon .gear-name { color: var(--q-uncommon); }
    .common .gear-icon { border-color: var(--q-common); }
    .common .gear-name { color: var(--q-common); }
    .poor .gear-icon { border-color: var(--q-poor); }
    .poor .gear-name { color: var(--q-poor); }

    /* Center Panel */
    .center-panel {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .info-block {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .info-block h3 {
      color: var(--gold);
      font-size: 1.1rem;
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Stat Priority */
    .stat-prio {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      font-size: 0.9rem;
      font-weight: 600;
    }
    
    .stat-badge {
      background: rgba(0,0,0,0.5);
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px solid #333;
    }

    .stat-badge.primary { color: #ff5252; border-color: #5c1b1b; }
    .stat-badge.secondary { color: #44ff44; border-color: #1b4d1b; }
    .stat-badge.tertiary { color: #e0e0e0; }

    /* Progress & Checklist */
    .status-row {
      display: flex;
      justify-content: space-around;
      margin-bottom: 20px;
      background: rgba(0,0,0,0.3);
      padding: 12px;
      border-radius: 6px;
    }

    .status-item {
      text-align: center;
    }

    .status-val {
      font-size: 1.3rem;
      color: #fff;
      font-weight: bold;
    }

    .status-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .checklist {
      list-style: none;
      margin-bottom: 15px;
    }

    .checklist-item {
      display: flex;
      align-items: center;
      background: rgba(0,0,0,0.2);
      padding: 10px 12px;
      margin-bottom: 6px;
      border-radius: 4px;
      border-left: 3px solid transparent;
      font-size: 0.9rem;
    }

    .checklist-item:hover {
      background: rgba(255,255,255,0.05);
    }

    .checklist-item.done {
      border-left-color: var(--q-uncommon);
      opacity: 0.6;
    }

    .checklist-item.done span {
      text-decoration: line-through;
    }

    .checklist-item input {
      margin-right: 12px;
      width: 16px;
      height: 16px;
      accent-color: var(--gold);
      cursor: pointer;
    }

    .add-form {
      display: flex;
      gap: 10px;
    }

    .add-form input {
      flex: 1;
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px 12px;
      border-radius: 4px;
      outline: none;
      font-size: 0.9rem;
    }
    
    .add-form input:focus {
      border-color: var(--gold);
    }

    .add-form button {
      background: var(--gold);
      color: #000;
      border: none;
      padding: 0 15px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }

    .sync-info {
      text-align: center;
      margin-top: 40px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="armory-header">
    <h1 id="char-name">Fabi</h1>
    <h2>
      <span id="char-level">14</span> 
      <span id="char-race">Dwarf</span> 
      <span id="char-class" style="color: #0070dd;">Shaman</span> 
      <span class="guild">&lt;The Argent Dawn&gt;</span>
    </h2>
    <h2 style="font-size: 0.9rem; color: var(--text-muted); margin-top: 4px;" id="char-realm">Stormhammer (Roleplay)</h2>
  </div>

  <div class="armory-grid">
    <!-- Venstre Udstyr -->
    <div class="gear-col gear-left" id="gear-left"></div>

    <!-- Midterpanel (Stat Prio, Quests, Progression) -->
    <div class="center-panel">
      
      <!-- Stat Prioritet Blok -->
      <div class="info-block">
        <h3>Stat Prioritet (Enhancement)</h3>
        <div class="stat-prio">
          <div class="stat-badge primary">1. Strength</div> <span>&gt;</span>
          <div class="stat-badge secondary">2. Agility</div> <span>&gt;</span>
          <div class="stat-badge tertiary">3. Stamina</div> <span>&gt;</span>
          <div class="stat-badge tertiary">Intellect</div>
        </div>
      </div>

      <!-- Progression / Action Items -->
      <div class="info-block">
        <h3>Næste Steps & Quests</h3>
        
        <div class="status-row">
          <div class="status-item">
            <div class="status-val" id="stat-slots">-</div>
            <div class="status-label">Equipped Slots</div>
          </div>
          <div class="status-item">
            <div class="status-val" id="stat-goals">0/0</div>
            <div class="status-label">Mål Klaret</div>
          </div>
        </div>

        <ul class="checklist" id="checklist"></ul>

        <form class="add-form" id="goal-form">
          <input type="text" id="new-goal" placeholder="Tilføj quest/mål..." required>
          <button type="submit">Tilføj</button>
        </form>
      </div>

    </div>

    <!-- Højre Udstyr -->
    <div class="gear-col gear-right" id="gear-right"></div>
    
    <!-- Bund Udstyr (Våben/Trinkets) -->
    <div class="gear-bottom" id="gear-bottom"></div>
  </div>

  <div class="sync-info" id="sync-time">Synkroniserer...</div>

  <script>
    // Data Indlæsning
    async function loadData() {
      try {
        const res = await fetch('./character.json?t=' + Date.now());
        const data = await res.json();

        if (data.profile) {
          document.getElementById('char-name').textContent = data.profile.name || 'Fabi';
          document.getElementById('char-level').textContent = data.profile.level || '14';
        }
        if (data.last_updated) {
          const d = new Date(data.last_updated);
          document.getElementById('sync-time').textContent = `Sidst opdateret: ${d.toLocaleString('da-DK')}`;
        }

        const items = (data.equipment && data.equipment.equipped_items) ? data.equipment.equipped_items : [];
        document.getElementById('stat-slots').textContent = items.length;

        const leftCol = document.getElementById('gear-left');
        const rightCol = document.getElementById('gear-right');
        const botCol = document.getElementById('gear-bottom');

        leftCol.innerHTML = '';
        rightCol.innerHTML = '';
        botCol.innerHTML = '';

        items.forEach((item, index) => {
          const el = document.createElement('div');
          const qClass = (item.quality?.type || 'common').toLowerCase();
          el.className = `gear-item ${qClass}`;
          
          const bgStyle = item.icon ? `style="background-image: url('${item.icon}')"` : '';
          
          el.innerHTML = `
            <div class="gear-info">
              <div class="gear-name">${item.name}</div>
              <div class="gear-slot">${item.slot?.name || 'Gear'}</div>
            </div>
            <div class="gear-icon" ${bgStyle}></div>
          `;

          if (index < 7) {
            leftCol.appendChild(el);
          } else if (index < 14) {
            rightCol.appendChild(el);
          } else {
            botCol.appendChild(el);
          }
        });

      } catch (e) {
        console.error("Fejl:", e);
        document.getElementById('sync-time').textContent = 'Fejl ved indlæsning af karakterdata.';
      }
    }

    // Tjekliste Logik
    const defaultGoals = [
      { text: "Nå Level 20: Træn Ghost Wolf", done: false },
      { text: "Start Water Totem Questline", done: false },
      { text: "Gennemfør Cozy Sleeping Bag quest", done: false },
      { text: "Lær 2H Axes/Maces (Level 20)", done: false }
    ];

    function getGoals() {
      const saved = localStorage.getItem('fabi_wow_goals');
      return saved ? JSON.parse(saved) : defaultGoals;
    }

    function saveGoals(goals) {
      localStorage.setItem('fabi_wow_goals', JSON.stringify(goals));
      renderGoals();
    }

    function renderGoals() {
      const goals = getGoals();
      const list = document.getElementById('checklist');
      list.innerHTML = '';
      
      let doneCount = 0;

      goals.forEach((g, idx) => {
        if (g.done) doneCount++;
        const li = document.createElement('li');
        li.className = `checklist-item ${g.done ? 'done' : ''}`;
        
        li.innerHTML = `
          <input type="checkbox" ${g.done ? 'checked' : ''} data-index="${idx}">
          <span>${g.text}</span>
        `;
        list.appendChild(li);
      });

      document.getElementById('stat-goals').textContent = `${doneCount}/${goals.length}`;

      list.querySelectorAll('input').forEach(chk => {
        chk.addEventListener('change', (e) => {
          const index = e.target.getAttribute('data-index');
          goals[index].done = e.target.checked;
          saveGoals(goals);
        });
      });
    }

    document.getElementById('goal-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('new-goal');
      const val = input.value.trim();
      if (!val) return;
      
      const goals = getGoals();
      goals.push({ text: val, done: false });
      saveGoals(goals);
      input.value = '';
    });

    loadData();
    renderGoals();
  </script>
</body>
</html>
