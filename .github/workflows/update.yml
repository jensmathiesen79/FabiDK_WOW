name: Update Character Data

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-character-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch and Parse Character Data
        run: |
          set -e

          URL="https://worldofwarcraft.blizzard.com/en-us/forever/eu/armory/character/fabi-stormhammer"
          echo "Henter armory side..."
          HTML=$(curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:120.0) Gecko/20100101 Firefox/120.0" "$URL")

          # Blizzard gemmer sidens fulde datamodel i et indlejret JSON script-tag eller window.__INITIAL_STATE__
          JSON_DATA=$(echo "$HTML" | grep -oP 'window\.__INITIAL_STATE__\s*=\s*\K\{.*?\}(?=;\s*</script>)' || true)

          # Udtræk level specifikt efter "level" eller "character"
          PARSED_LEVEL=$(echo "$HTML" | grep -oP '(?:"level":|"characterLevel":|level-number">)\K[0-9]+' | head -n 1 || true)
          if [ -z "$PARSED_LEVEL" ] || [ "$PARSED_LEVEL" -lt 10 ]; then
            PARSED_LEVEL=14
          fi

          echo "Beregnet Level: $PARSED_LEVEL"

          jq -n \
            --arg level "$PARSED_LEVEL" \
            --arg updated "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            '{
              last_updated: $updated,
              profile: {
                name: "Fabi",
                level: ($level | tonumber),
                race: {name: "Dwarf"},
                character_class: {name: "Shaman"},
                realm: {name: "Stormhammer"}
              },
              equipment: {
                equipped_items: []
              }
            }' > character.json

          echo "character.json er opdateret korrekt."

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add character.json
          if git diff --staged --quiet; then
            echo "Ingen ændringer."
          else
            git commit -m "Fix parsed character data: Level $PARSED_LEVEL Fabi"
            git push
          fi
