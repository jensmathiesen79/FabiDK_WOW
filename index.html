<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fabi - WoW Armory</title>
  <style>
    :root {
      --bg-base: #0b0c10;
      --panel-bg: #0e1015;
      --border-color: #1f232d;
      --gold-text: #f8b700;
      --nav-gold: #ffc100;
      --text-main: #d1d5db;
      --text-muted: #8b92a5;
      
      --q-epic: #a335ee;
      --q-rare: #0070dd;
      --q-uncommon: #1eff00;
      --q-common: #ffffff;
      --q-poor: #9d9d9d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Open Sans", "Segoe UI", Roboto, Arial, sans-serif; }

    body {
      background: #050608 radial-gradient(circle at 50% 30%, #1e283c 0%, #050608 60%) no-repeat;
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 40px;
    }

    .armory-header { width: 100%; max-width: 1200px; padding: 0 20px; margin-bottom: 30px; position: relative; z-index: 10; }
    .header-top { display: flex; align-items: baseline; gap: 15px; margin-bottom: 5px; }
    .char-name { font-size: 2.5rem; color: #3b82f6; font-weight: bold; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }
    .ilvl { font-size: 1.2rem; color: var(--nav-gold); font-weight: bold; }
    .char-sub { font-size: 0.95rem; color: var(--text-main); margin-bottom: 20px; }
    .char-sub .guild { color: #b38b38; font-style: italic; }
    .char-sub .realm { color: var(--text-muted); }
    .nav-tabs { display: flex; gap: 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 10px; }
    .nav-tabs span { font-size: 0.8rem; font-weight: bold; text-transform: uppercase; color: var(--text-muted); cursor: pointer; }
    .nav-tabs span.active { color: var(--nav-gold); border-bottom: 2px solid var(--nav-gold); padding-bottom: 10px; margin-bottom: -11px; }

    .character-stage { display: flex; justify-content: space-between; width: 100%; max-width: 1100px; min-height: 550px; padding: 0 20px; position: relative; }
    
    /* NYT: Opsætning af karakteren i midten */
    .character-model {
      position: absolute;
      top: -30px; 
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1; /* Ligger bagerst, under udstyret */
      pointer-events: none; /* Gør at man ikke kan klikke på billedet ved en fejl */
    }
    .character-model img {
      max-height: 120%; /* Skalerer figuren så den fylder godt i højden */
      max-width: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 25px rgba(0,0,0,0.7)); /* Giver 3D-effekt og dybde mod baggrunden */
    }

    .gear-col { display: flex; flex-direction: column; gap: 14px; width: 300px; z-index: 10; }
    .gear-col.left { text-align: right; }
    .gear-col.right { text-align: left; }
    .gear-bottom { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; z-index: 10; }

    .gear-item { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; transition: transform 0.1s; }
    .gear-item:hover { transform: scale(1.02); }
    .gear-col.left .gear-item { flex-direction: row; }
    .gear-col.right .gear-item, .gear-bottom .gear-item { flex-direction: row-reverse; }

    .gear-icon {
      width: 48px;
      height: 48px;
      background-color: #111;
      border: 2px solid var(--q-common);
      border-radius: 4px;
      box-shadow: 0 0 10px rgba(0,0,0,0.8);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .gear-icon img { width: 100%; height: 100%; object-fit: cover; }
    .gear-icon .fallback { color: #555; font-size: 22px; font-weight: bold; }

    .gear-info { display: flex; flex-direction: column; justify-content: center; }
    .gear-name { font-size: 0.9rem; font-weight: 600; text-shadow: 1px 1px 2px #000; }

    .epic .gear-icon { border-color: var(--q-epic); }
    .epic .gear-name { color: var(--q-epic); }
    .rare .gear-icon { border-color: var(--q-rare); }
    .rare .gear-name { color: var(--q-rare); }
    .uncommon .gear-icon { border-color: var(--q-uncommon); }
    .uncommon .gear-name { color: var(--q-uncommon); }
    .common .gear-icon { border-color: var(--q-common); }
    .common .gear-name { color: var(--q-common); }
    .poor .gear-icon { border-color: var(--q-poor); }
    .poor .gear-name { color: var(--q-poor); }

    .dashboard-bottom { width: 100%; background: var(--panel-bg); border-top: 1px solid rgba(255,255,255,0.05); margin-top: 40px; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; flex-grow: 1; z-index: 20; position: relative; }
    .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; width: 100%; max-width: 1100px; }
    @media (max-width: 800px) { .dashboard-grid { grid-template-columns: 1fr; } }
    .panel-section h3 { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; margin-bottom: 20px; }
    
    .stat-prio { display: flex; align-items: center; gap: 15px; background: rgba(0,0,0,0.4); padding: 15px 20px; border-radius: 4px; border: 1px solid var(--border-color); }
    .prio-item { display: flex; align-items: center; gap: 10px; }
    .prio-num { color: var(--text-muted); font-size: 0.8rem; }
    .prio-val { font-weight: bold; color: #fff; }
    .prio-arr { color: #555; }

    .checklist { list-style: none; }
    .checklist-item { display: flex; align-items: center; padding: 12px 15px; border-bottom: 1px solid rgba(255,255,255,0.03); }
    .checklist-item input { margin-right: 15px; accent-color: var(--nav-gold); width: 16px; height: 16px; }
    .checklist-item.done span { text-decoration: line-through; color: var(--text-muted); }
    .add-form { display: flex; margin-top: 15px; gap: 10px; }
    .add-form input { flex: 1; background: rgba(0,0,0,0.5); border: 1px solid var(--border-color); color: #fff; padding: 10px; border-radius: 4px; }
    .add-form button { background: var(--border-color); color: var(--text-main); border: 1px solid rgba(255,255,255,0.1); padding: 0 15px; cursor: pointer; border-radius: 4px; }
    .sync-text { text-align: center; margin-top: 40px; font-size: 0.8rem; color: #444; }
  </style>
</head>
<body>

  <div class="armory-header">
    <div class="header-top">
      <div class="char-name" id="char-name">Fabi Stormhammer</div>
      <div class="ilvl" id="char-ilvl">0 ILVL</div>
    </div>
    <div class="char-sub">
      <span id="char-level">14</span> 
      <span id="char-race">Dwarf</span> 
      <span id="char-class" style="color: #0070dd;">Shaman</span> 
      <span class="guild">&lt;The Argent Dawn&gt;</span>
      <span class="realm">Stormhammer (Roleplay)</span>
    </div>
    <div class="nav-tabs">
      <span class="active">Character</span>
      <span>Collections</span>
      <span>Player vs Player</span>
      <span>Reputation</span>
    </div>
  </div>

  <div class="character-stage">
    <!-- Karakterbillede hentes automatisk her -->
    <div class="character-model">
      <img src="fabi.png" alt="Fabi Character Model" onerror="this.style.opacity='0'">
    </div>

    <div class="gear-col left" id="gear-left"></div>
    <div class="gear-col right" id="gear-right"></div>
    <div class="gear-bottom" id="gear-bottom"></div>
  </div>

  <div class="dashboard-bottom">
    <div class="dashboard-grid">
      <div class="panel-section">
        <h3>Specialization & Stat Priority</h3>
        <div class="stat-prio">
          <div class="prio-item"><span class="prio-num">1</span><span class="prio-val" style="color: #ff5252;">Strength</span></div>
          <div class="prio-arr">></div>
          <div class="prio-item"><span class="prio-num">2</span><span class="prio-val" style="color: #44ff44;">Agility</span></div>
          <div class="prio-arr">></div>
          <div class="prio-item"><span class="prio-num">3</span><span class="prio-val">Stamina</span></div>
        </div>
      </div>

      <div class="panel-section">
        <h3>Action Items & Quests (<span id="quest-count">0/0</span>)</h3>
        <ul class="checklist" id="checklist"></ul>
        <form class="add-form" id="goal-form">
          <input type="text" id="new-goal" placeholder="Tilføj ny quest..." required>
          <button type="submit">Tilføj</button>
        </form>
      </div>
    </div>
    <div class="sync-text" id="sync-time">Venter på data...</div>
  </div>

  <script>
    async function loadData() {
      try {
        const res = await fetch('./character.json?cachebuster=' + new Date().getTime());
        const data = await res.json();

        if (data.profile) {
          let charName = data.profile.name || 'Fabi';
          if (!charName.includes('Stormhammer')) charName += ' Stormhammer';
          document.getElementById('char-name').textContent = charName;
          document.getElementById('char-level').textContent = data.profile.level || '14';
        }
        
        if (data.last_updated) {
          const d = new Date(data.last_updated);
          document.getElementById('sync-time').textContent = `Sidst opdateret: ${d.toLocaleString('da-DK')}`;
        }

        const items = (data.equipment && data.equipment.equipped_items) ? data.equipment.equipped_items : [];
        document.getElementById('char-ilvl').textContent = `${items.length * 2} ILVL`;

        const leftCol = document.getElementById('gear-left');
        const rightCol = document.getElementById('gear-right');
        const botCol = document.getElementById('gear-bottom');

        leftCol.innerHTML = ''; rightCol.innerHTML = ''; botCol.innerHTML = '';

        items.forEach((item, index) => {
          const el = document.createElement('a'); 
          const qClass = (item.quality?.type || 'common').toLowerCase();
          
          el.className = `gear-item ${qClass}`;
          const safeName = encodeURIComponent(item.name);
          el.href = `https://www.wowhead.com/classic/search?q=${safeName}`;
          el.target = "_blank";
          
          const iconHtml = (item.icon && item.icon.length > 5) 
            ? `<img src="${item.icon}" onerror="this.style.display='none'">` 
            : `<span class="fallback">?</span>`;

          el.innerHTML = `
            <div class="gear-info">
              <div class="gear-name">${item.name}</div>
            </div>
            <div class="gear-icon">
              ${iconHtml}
            </div>
          `;

          if (index < 7) {
            leftCol.appendChild(el);
          } else if (index < 14) {
            rightCol.appendChild(el);
          } else {
            botCol.appendChild(el);
          }
        });

      } catch (e) {
        console.error("Fejl:", e);
        document.getElementById('sync-time').textContent = 'Fejl: Kunne ikke indlæse character.json';
      }
    }

    const defaultGoals = [
      { text: "Nå Level 20: Træn Ghost Wolf", done: false },
      { text: "Start Water Totem Questline", done: false },
      { text: "Gennemfør Cozy Sleeping Bag quest", done: false },
      { text: "Lær 2H Axes/Maces (Level 20)", done: false }
    ];

    function getGoals() {
      const saved = localStorage.getItem('fabi_wow_goals');
      return saved ? JSON.parse(saved) : defaultGoals;
    }

    function saveGoals(goals) {
      localStorage.setItem('fabi_wow_goals', JSON.stringify(goals));
      renderGoals();
    }

    function renderGoals() {
      const goals = getGoals();
      const list = document.getElementById('checklist');
      list.innerHTML = '';
      
      let doneCount = 0;
      goals.forEach((g, idx) => {
        if (g.done) doneCount++;
        const li = document.createElement('li');
        li.className = `checklist-item ${g.done ? 'done' : ''}`;
        li.innerHTML = `
          <input type="checkbox" ${g.done ? 'checked' : ''} data-index="${idx}">
          <span>${g.text}</span>
        `;
        list.appendChild(li);
      });

      document.getElementById('quest-count').textContent = `${doneCount}/${goals.length}`;

      list.querySelectorAll('input').forEach(chk => {
        chk.addEventListener('change', (e) => {
          const index = e.target.getAttribute('data-index');
          goals[index].done = e.target.checked;
          saveGoals(goals);
        });
      });
    }

    document.getElementById('goal-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('new-goal');
      const val = input.value.trim();
      if (!val) return;
      const goals = getGoals();
      goals.push({ text: val, done: false });
      saveGoals(goals);
      input.value = '';
    });

    loadData();
    renderGoals();
  </script>
</body>
</html>
