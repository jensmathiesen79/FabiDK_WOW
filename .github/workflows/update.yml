name: Update Character Data

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-character-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Scrape Armory (Med Ikoner Fix)
        run: |
          node - << 'EOF'
          const fs = require('fs');
          const puppeteer = require('puppeteer');

          (async () => {
            const browser = await puppeteer.launch({
              headless: "new",
              args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-blink-features=AutomationControlled']
            });
            const page = await browser.newPage();
            
            await page.setRequestInterception(true);
            page.on('request', (req) => {
              // VIGTIGT: Vi blokerer IKKE 'image' længere. Ellers bygger Blizzard ikke URL'en.
              if (['stylesheet', 'font', 'media'].includes(req.resourceType())) {
                req.abort();
              } else {
                req.continue();
              }
            });

            await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36');
            
            const url = 'https://worldofwarcraft.blizzard.com/en-us/forever/eu/armory/character/fabi-stormhammer';
            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
            
            await new Promise(r => setTimeout(r, 4000));

            const parsed = await page.evaluate(() => {
              let lvl = 14;
              const items = [];
              
              const txt = document.body.innerText;
              const m = txt.match(/(\d+)\s+Dwarf\s+Shaman/i) || txt.match(/Level\s+(\d+)/i);
              if (m) lvl = parseInt(m[1], 10);
              
              const elements = document.querySelectorAll('.GameIcon-icon, [data-item-id]');
              elements.forEach(el => {
                let container = el.parentElement;
                for (let i = 0; i < 4; i++) {
                  if (container && container.innerText && container.innerText.trim().length > 2) break;
                  if (container) container = container.parentElement;
                }
                
                if (container && container.innerText) {
                  const lines = container.innerText.trim().split('\n').filter(s => s.trim().length > 1);
                  if (lines.length > 0) {
                    const name = lines[0];
                    const lowerName = name.toLowerCase();
                    
                    // Filtrer 'Level' og 'Specialization' fra
                    if (name.length > 2 && !items.find(i => i.name === name) && !lowerName.includes('level') && !lowerName.includes('specialization')) {
                      
                      let q = 'common';
                      const html = container.innerHTML.toLowerCase();
                      if (html.includes('epic') || html.includes('q4') || html.includes('quality-4')) q = 'epic';
                      else if (html.includes('rare') || html.includes('q3') || html.includes('quality-3')) q = 'rare';
                      else if (html.includes('uncommon') || html.includes('q2') || html.includes('quality-2')) q = 'uncommon';
                      else if (html.includes('poor') || html.includes('q0') || html.includes('quality-0')) q = 'poor';
                      
                      // Hent ikon URL
                      let iconUrl = '';
                      const iconNode = container.querySelector('.GameIcon-icon');
                      if (iconNode && iconNode.style.backgroundImage) {
                        iconUrl = iconNode.style.backgroundImage.replace(/^url\(["']?/, '').replace(/["']?\)$/, '');
                      }
                      
                      items.push({
                        name: name,
                        icon: iconUrl,
                        slot: { name: container.getAttribute('data-slot') || container.getAttribute('data-slot-name') || 'Gear' },
                        quality: { type: q }
                      });
                    }
                  }
                }
              });
              
              return { level: lvl, items };
            });
            await browser.close();

            const finalData = {
              last_updated: new Date().toISOString(),
              profile: {
                name: "Fabi",
                level: parsed.level || 14,
                race: { name: "Dwarf" },
                character_class: { name: "Shaman" },
                realm: { name: "Stormhammer" }
              },
              equipment: {
                equipped_items: parsed.items
              }
            };

            fs.writeFileSync('character.json', JSON.stringify(finalData, null, 2));
          })();
          EOF

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add character.json
          if git diff --staged --quiet; then
            echo "Ingen ændringer."
          else
            git commit -m "Scrape gear icons fix"
            git push
          fi
