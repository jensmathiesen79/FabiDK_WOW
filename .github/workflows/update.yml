name: Update Character Data

on:
  schedule:
    # Kører automatisk hver dag kl. 04:00 UTC
    - cron: '0 4 * * *'
  # Gør det muligt at køre workflowet manuelt fra GitHub Actions fanebladet
  workflow_dispatch:

  Permissions:
    Contents: write-all

jobs:
  fetch-character-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch Battle.net Token and Character Data
        env:
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
        run: |
          set -e

          # 1. Hent OAuth Access Token fra Blizzard EU
          echo "Henter OAuth token..."
          TOKEN_RESPONSE=$(curl -s -u "$BNET_CLIENT_ID:$BNET_CLIENT_SECRET" \
            -d grant_type=client_credentials \
            https://oauth.battle.net/token)

          ACCESS_TOKEN=$(echo $TOKEN_RESPONSE | jq -r '.access_token')

          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" == "null" ]; then
            echo "Fejl: Kunne ikke hente access token."
            exit 1
          fi

          # 2. Hent karakterprofil og udstyr
          REALM="stormhammer"
          NAME="fabi"
          NAMESPACE="profile-classic1x-eu"
          LOCALE="en_US"

          echo "Henter profil for $NAME på $REALM..."
          PROFILE_DATA=$(curl -s -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://eu.api.blizzard.com/profile/wow/character/${REALM}/${NAME}?namespace=${NAMESPACE}&locale=${LOCALE}")

          echo "Henter udstyr..."
          EQUIPMENT_DATA=$(curl -s -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://eu.api.blizzard.com/profile/wow/character/${REALM}/${NAME}/equipment?namespace=${NAMESPACE}&locale=${LOCALE}")

          # 3. Saml data i character.json
          jq -n \
            --argjson profile "$PROFILE_DATA" \
            --argjson equipment "$EQUIPMENT_DATA" \
            --arg updated "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            '{last_updated: $updated, profile: $profile, equipment: $equipment}' > character.json

          echo "character.json opdateret med succes."

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add character.json
          if git diff --staged --quiet; then
            echo "Ingen ændringer fundet i data."
          else
            git commit -m "Update WoW character data: Fabi-Stormhammer"
            git push
          fi
