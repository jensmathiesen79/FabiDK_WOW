name: Update Character Data

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-character-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch Armory Data
        run: |
          set -e

          # Hent den rå Armory HTML side
          URL="https://worldofwarcraft.blizzard.com/en-us/forever/eu/armory/character/fabi-stormhammer"
          echo "Henter armory side..."
          curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "$URL" > armory.html

          # Kontroller om siden findes
          if grep -q "Character Not Found" armory.html; then
            echo "Fejl: Karakter ikke fundet på armory."
            exit 1
          fi

          # Saml status (eller bevar grundstrukturen hvis API testes)
          jq -n \
            --arg updated "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            '{
              last_updated: $updated,
              profile: {
                name: "Fabi",
                level: 12,
                race: {name: "Dwarf"},
                character_class: {name: "Shaman"},
                realm: {name: "Stormhammer"}
              },
              equipment: {
                equipped_items: []
              }
            }' > character.json

          echo "character.json opdateret."

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add character.json
          if git diff --staged --quiet; then
            echo "Ingen ændringer."
          else
            git commit -m "Update WoW character data: Fabi-Stormhammer"
            git push
          fi
