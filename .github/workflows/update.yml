name: Update Character Data

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-character-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch and Parse Armory Data
        run: |
          set -e

          URL="https://worldofwarcraft.blizzard.com/en-us/forever/eu/armory/character/fabi-stormhammer"
          echo "Henter armory side..."
          curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "$URL" > armory.html

          # Udtræk level fra armory HTML (falder tilbage på 14 hvis mønstret ændres)
          PARSED_LEVEL=$(grep -oP 'Level \K[0-9]+' armory.html | head -n 1 || true)
          if [ -z "$PARSED_LEVEL" ]; then
            PARSED_LEVEL=14
          fi

          echo "Registreret level: $PARSED_LEVEL"

          jq -n \
            --arg level "$PARSED_LEVEL" \
            --arg updated "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            '{
              last_updated: $updated,
              profile: {
                name: "Fabi",
                level: ($level | tonumber),
                race: {name: "Dwarf"},
                character_class: {name: "Shaman"},
                realm: {name: "Stormhammer"}
              },
              equipment: {
                equipped_items: []
              }
            }' > character.json

          echo "character.json opdateret."

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add character.json
          if git diff --staged --quiet; then
            echo "Ingen ændringer."
          else
            git commit -m "Update WoW character data: Level $PARSED_LEVEL Fabi-Stormhammer"
            git push
          fi
