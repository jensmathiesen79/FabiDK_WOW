name: Update Character Data

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-character-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Scrape Armory via Headless Browser
        run: |
          node - << 'EOF'
          const fs = require('fs');
          const puppeteer = require('puppeteer');

          (async () => {
            const browser = await puppeteer.launch({
              headless: "new",
              args: [
                '--no-sandbox', 
                '--disable-setuid-sandbox',
                '--disable-blink-features=AutomationControlled'
              ]
            });
            const page = await browser.newPage();
            await page.setViewport({ width: 1440, height: 900 });
            await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36');

            const url = 'https://worldofwarcraft.blizzard.com/en-us/forever/eu/armory/character/fabi-stormhammer';
            console.log('Navigerer til:', url);
            
            const response = await page.goto(url, { waitUntil: 'networkidle2', timeout: 60000 });
            console.log('HTTP Status:', response.status());

            // Giv siden tid til at rendere
            await new Promise(r => setTimeout(r, 3000));

            // VISUELT BEVIS: Tag et screenshot af hvad botten reelt ser
            await page.screenshot({ path: 'debug.png', fullPage: true });
            console.log('Gemte debug.png for visuel bekræftelse.');

            const parsed = await page.evaluate(() => {
              let lvl = 14;
              let items = [];

              try {
                // Tjek 1: Internt data-objekt
                if (window.__INITIAL_STATE__ && window.__INITIAL_STATE__.character) {
                  const char = window.__INITIAL_STATE__.character;
                  if (char.level) lvl = char.level;
                  if (char.equipment && char.equipment.equipped_items) {
                    items = char.equipment.equipped_items.map(it => ({
                      name: it.name || it.item?.name || 'Item',
                      slot: { name: it.slot?.name || it.slot?.type || 'Gear' },
                      quality: { type: (it.quality?.type || 'common').toLowerCase() }
                    }));
                    return { level: lvl, items };
                  }
                }

                // Tjek 2: Gennemgå HTML for links og slots
                const links = document.querySelectorAll('a[href*="/item/"], div[data-item-id], div[class*="CharacterEquipmentSlot"]');
                links.forEach(el => {
                  const text = el.getAttribute('aria-label') || el.innerText || '';
                  const cleanName = text.split('\n')[0].trim();
                  const slotAttr = el.getAttribute('data-slot') || el.getAttribute('data-slot-name') || 'Gear';

                  let quality = 'common';
                  const classStr = el.className.toLowerCase();
                  if (classStr.includes('epic') || classStr.includes('quality-4')) quality = 'epic';
                  else if (classStr.includes('rare') || classStr.includes('quality-3')) quality = 'rare';
                  else if (classStr.includes('uncommon') || classStr.includes('quality-2')) quality = 'uncommon';
                  else if (classStr.includes('poor') || classStr.includes('quality-0')) quality = 'poor';

                  if (cleanName && cleanName.length > 2 && !cleanName.includes('Empty')) {
                    items.push({ name: cleanName, slot: { name: slotAttr }, quality: { type: quality } });
                  }
                });

                // Tjek 3: Level fallback fra tekst
                if (document.body && document.body.innerText) {
                  const textMatch = document.body.innerText.match(/Level\s+(\d+)/i);
                  if (textMatch) lvl = parseInt(textMatch[1], 10);
                }
              } catch (e) {
                console.error("Fejl i parsing:", e);
              }

              return { level: lvl, items };
            });

            await browser.close();

            const finalData = {
              last_updated: new Date().toISOString(),
              profile: {
                name: "Fabi",
                level: parsed.level || 14,
                race: { name: "Dwarf" },
                character_class: { name: "Shaman" },
                realm: { name: "Stormhammer" }
              },
              equipment: {
                equipped_items: parsed.items
              }
            };

            fs.writeFileSync('character.json', JSON.stringify(finalData, null, 2));
          })();
          EOF

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add character.json debug.png
          if git diff --staged --quiet; then
            echo "Ingen ændringer."
          else
            git commit -m "Scrape data og opdater debug.png"
            git push
          fi
