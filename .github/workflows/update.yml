name: Update Character Data

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-character-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Scrape Armory (Fast Mode)
        run: |
          node - << 'EOF'
          const fs = require('fs');
          const puppeteer = require('puppeteer');

          (async () => {
            const browser = await puppeteer.launch({
              headless: "new",
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            const page = await browser.newPage();
            
            // HASTIGHEDSOPTIMERING: Bloker alt tungt indhold (billeder, CSS, fonte)
            await page.setRequestInterception(true);
            page.on('request', (req) => {
              if (['image', 'stylesheet', 'font', 'media'].includes(req.resourceType())) {
                req.abort();
              } else {
                req.continue();
              }
            });

            await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/122.0.0.0 Safari/537.36');
            
            const url = 'https://worldofwarcraft.blizzard.com/en-us/forever/eu/armory/character/fabi-stormhammer';
            console.log('Navigerer lyn-hurtigt til:', url);
            
            // networkidle2 er meget hurtigere nu, hvor billeder er blokeret
            await page.goto(url, { waitUntil: 'networkidle2', timeout: 30000 });

            const parsed = await page.evaluate(() => {
              let lvl = 14;
              const items = [];
              
              const txt = document.body.innerText;
              const m = txt.match(/(\d+)\s+Dwarf\s+Shaman/i) || txt.match(/Level\s+(\d+)/i);
              if (m) lvl = parseInt(m[1], 10);
              
              // Mere aggressiv søgning efter udstyr
              const elements = document.querySelectorAll('.GameIcon-icon, [data-item-id]');
              elements.forEach(el => {
                let container = el.parentElement;
                // Hop opad indtil vi rammer en kasse med tekst
                for (let i = 0; i < 4; i++) {
                  if (container && container.innerText && container.innerText.trim().length > 2) break;
                  if (container) container = container.parentElement;
                }
                
                if (container && container.innerText) {
                  const lines = container.innerText.trim().split('\n').filter(s => s.trim().length > 1);
                  if (lines.length > 0) {
                    const name = lines[0];
                    // Undgå dubletter og forkerte udtræk
                    if (name.length > 2 && !items.find(i => i.name === name) && !name.includes('Level')) {
                      let q = 'common';
                      const html = container.innerHTML.toLowerCase();
                      if (html.includes('epic') || html.includes('q4')) q = 'epic';
                      else if (html.includes('rare') || html.includes('q3')) q = 'rare';
                      else if (html.includes('uncommon') || html.includes('q2')) q = 'uncommon';
                      
                      items.push({
                        name: name,
                        slot: { name: container.getAttribute('data-slot') || 'Gear' },
                        quality: { type: q }
                      });
                    }
                  }
                }
              });
              
              return { level: lvl, items };
            });
            await browser.close();

            const finalData = {
              last_updated: new Date().toISOString(),
              profile: {
                name: "Fabi",
                level: parsed.level || 14,
                race: { name: "Dwarf" },
                character_class: { name: "Shaman" },
                realm: { name: "Stormhammer" }
              },
              equipment: {
                equipped_items: parsed.items
              }
            };

            fs.writeFileSync('character.json', JSON.stringify(finalData, null, 2));
            console.log("Fandt", parsed.items.length, "genstande.");
          })();
          EOF

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add character.json
          if git diff --staged --quiet; then
            echo "Ingen ændringer."
          else
            git commit -m "Fast-scrape gear via request interception"
            git push
          fi
