name: Update Character Data

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-character-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Scrape Armory via Headless Browser
        run: |
          node - << 'EOF'
          const fs = require('fs');
          const puppeteer = require('puppeteer');

          (async () => {
            const browser = await puppeteer.launch({
              headless: "new",
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            const page = await browser.newPage();
            await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36');

            const url = 'https://worldofwarcraft.blizzard.com/en-us/forever/eu/armory/character/fabi-stormhammer';
            console.log('Navigerer til:', url);
            await page.goto(url, { waitUntil: 'networkidle2', timeout: 60000 });

            // Hent data direkte fra DOM
            const characterData = await page.evaluate(() => {
              // Level
              let level = 14;
              const textContent = document.body.innerText;
              const lvlMatch = textContent.match(/Level\s+(\d+)/i);
              if (lvlMatch) level = parseInt(lvlMatch[1], 10);

              // Udstyrsslots
              const equippedItems = [];
              const itemElements = document.querySelectorAll('[data-item-id], [class*="CharacterEquipment-item"], [class*="ItemSlot"]');

              itemElements.forEach(el => {
                const name = el.getAttribute('aria-label') || el.innerText.trim();
                const slot = el.getAttribute('data-slot') || 'Gear';
                let quality = 'common';

                const cl = el.className.toLowerCase();
                if (cl.includes('epic') || cl.includes('quality-4')) quality = 'epic';
                else if (cl.includes('rare') || cl.includes('quality-3')) quality = 'rare';
                else if (cl.includes('uncommon') || cl.includes('quality-2')) quality = 'uncommon';

                if (name && !name.includes('\n') && name.length > 1) {
                  equippedItems.push({
                    name: name,
                    slot: { name: slot },
                    quality: { type: quality }
                  });
                }
              });

              return { level, equippedItems };
            });

            await browser.close();

            const finalJson = {
              last_updated: new Date().toISOString(),
              profile: {
                name: "Fabi",
                level: characterData.level,
                race: { name: "Dwarf" },
                character_class: { name: "Shaman" },
                realm: { name: "Stormhammer" }
              },
              equipment: {
                equipped_items: characterData.equippedItems
              }
            };

            fs.writeFileSync('character.json', JSON.stringify(finalJson, null, 2));
            console.log('Gemte character.json:', finalJson);
          })();
          EOF

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add character.json
          if git diff --staged --quiet; then
            echo "Ingen ændringer."
          else
            git commit -m "Sync Fabi gear and level from Armory"
            git push
          fi
