<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fabi Stormhammer · WoW Forever</title>
<style>
  :root {
    --bg: #07080b; --panel: #0f1218; --panel-2: #141820; --line: #222836;
    --text: #d6dae3; --muted: #8a91a3; --gold: #f8b700; --shaman: #0070dd;
    --q-poor: #9d9d9d; --q-common: #ffffff; --q-uncommon: #1eff00; --q-rare: #0070dd; --q-epic: #a335ee; --q-legendary: #ff8000;
    --ok: #3ecf6e; --warn: #f0a33a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 14px/1.45 "Segoe UI", Roboto, system-ui, sans-serif; color: var(--text);
    background: var(--bg) radial-gradient(ellipse at 50% 0%, #17233a 0%, var(--bg) 60%) no-repeat fixed; min-height: 100vh; }
  a { color: inherit; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 20px 60px; }

  /* Header */
  header { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; margin-bottom: 24px; }
  .avatar { width: 72px; height: 72px; border-radius: 8px; border: 2px solid var(--shaman); background: #111 center/cover; flex-shrink: 0; }
  .who h1 { font-size: 2rem; color: var(--shaman); line-height: 1.1; }
  .who h1 .sur { color: var(--text); font-weight: 400; }
  .who .sub { color: var(--muted); margin-top: 4px; }
  .who .sub b { color: var(--text); font-weight: 600; }
  .who .guild { color: #c9a24a; font-style: italic; }
  .kpis { margin-left: auto; display: flex; gap: 10px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; text-align: center; min-width: 88px; }
  .kpi .v { font-size: 1.4rem; font-weight: 700; color: var(--gold); }
  .kpi .l { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }

  .grid { display: grid; grid-template-columns: 1.15fr 1fr; gap: 20px; }
  @media (max-width: 920px) { .grid { grid-template-columns: 1fr; } .kpis { margin-left: 0; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
  .card h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .card h2 small { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .span2 { grid-column: 1 / -1; }

  /* Paperdoll */
  .doll { display: grid; grid-template-columns: 1fr 150px 1fr; gap: 10px; align-items: start; }
  .doll .col { display: flex; flex-direction: column; gap: 6px; }
  .doll .model { align-self: stretch; background: center 30% / contain no-repeat; min-height: 360px; opacity: .9; }
  .doll .bottom { grid-column: 1 / -1; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  @media (max-width: 600px) { .doll { grid-template-columns: 1fr 1fr; } .doll .model { display: none; } }
  .slot { display: flex; align-items: center; gap: 8px; padding: 4px; border-radius: 6px; text-decoration: none; min-height: 44px; }
  .slot:hover { background: var(--panel-2); }
  .col.r .slot { flex-direction: row-reverse; text-align: right; }
  .ic { width: 38px; height: 38px; border-radius: 5px; border: 2px solid #444; background: #0b0d12 center/cover; flex-shrink: 0; }
  .slot .t { min-width: 0; }
  .slot .n { font-weight: 600; font-size: .86rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }
  .slot .s { font-size: .72rem; color: var(--muted); }
  .slot.empty .ic { border-style: dashed; border-color: #333; }
  .slot.empty .n { color: #555; font-weight: 400; }
  .q-poor { --q: var(--q-poor); } .q-common { --q: var(--q-common); } .q-uncommon { --q: var(--q-uncommon); }
  .q-rare { --q: var(--q-rare); } .q-epic { --q: var(--q-epic); } .q-legendary { --q: var(--q-legendary); }
  [class*="q-"] .ic { border-color: var(--q); } [class*="q-"] .n, .qn[class*="q-"] { color: var(--q); }

  /* Quests */
  .quest { display: grid; grid-template-columns: 46px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .quest:first-of-type { border-top: 0; }
  .lv { font-weight: 700; text-align: center; border-radius: 6px; padding: 6px 0; font-size: .85rem; background: var(--panel-2); color: var(--muted); }
  .quest.ready .lv { background: rgba(62,207,110,.15); color: var(--ok); }
  .quest.soon .lv { background: rgba(240,163,58,.12); color: var(--warn); }
  .quest.done { opacity: .45; } .quest.done .qt { text-decoration: line-through; }
  .qt { font-weight: 600; } .qt .tag { font-size: .68rem; font-weight: 600; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: 2px; }
  .qchk input { accent-color: var(--ok); width: 14px; height: 14px; margin-right: 7px; vertical-align: -2px; cursor: pointer; }
  .quest.done { opacity: .45; }
  .qd { color: var(--muted); font-size: .82rem; margin-top: 2px; }
  .qd .warn { color: var(--warn); display: block; margin-top: 3px; }
  .qd a { color: #7fb2ff; text-decoration: none; } .qd a:hover { text-decoration: underline; }

  /* Upgrades */
  .filters { display: flex; gap: 6px; }
  .filters button { background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 3px 9px; cursor: pointer; font-size: .78rem; }
  .filters button.on { color: var(--text); border-color: var(--gold); }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .itm { display: flex; gap: 8px; align-items: center; text-decoration: none; }
  .itm .ic { width: 30px; height: 30px; }
  .stats { color: var(--muted); font-size: .76rem; }
  .delta { color: var(--ok); font-weight: 700; }
  .badge { font-size: .7rem; padding: 1px 6px; border-radius: 4px; background: var(--panel-2); color: var(--muted); white-space: nowrap; }
  .badge.now { color: var(--ok); background: rgba(62,207,110,.12); }
  .g { color: #ffd100; } .s { color: #c7c7cf; } .c { color: #c4723b; }
  .note { color: var(--muted); font-size: .78rem; margin-top: 10px; }
  .empty-msg { color: var(--muted); padding: 10px 0; }
  .scroll { overflow-x: auto; }

  /* Prio + checklist */
  .prio { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .prio span { background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 4px 9px; font-weight: 600; }
  .prio i { color: #555; font-style: normal; }
  .check li { list-style: none; display: flex; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); }
  .check li.done span { text-decoration: line-through; color: var(--muted); }
  .check li button { margin-left: auto; background: none; border: 0; color: #555; cursor: pointer; font-size: 1rem; }
  .check input[type=checkbox] { accent-color: var(--gold); width: 15px; height: 15px; }
  form.add { display: flex; gap: 8px; margin-top: 10px; }
  form.add input { flex: 1; background: #0b0d12; border: 1px solid var(--line); color: var(--text); padding: 8px; border-radius: 5px; }
  form.add button { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); padding: 0 14px; border-radius: 5px; cursor: pointer; }
  footer { text-align: center; color: #555; font-size: .78rem; margin-top: 28px; }
  footer a { color: #777; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="avatar" id="avatar"></div>
    <div class="who">
      <h1 id="name">Fabi <span class="sur">Stormhammer</span></h1>
      <div class="sub" id="sub">Indlæser…</div>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="v" id="k-level">–</div><div class="l">Level</div></div>
      <div class="kpi"><div class="v" id="k-ilvl">–</div><div class="l">Item level</div></div>
      <div class="kpi"><div class="v" id="k-up">–</div><div class="l">AH-forslag</div></div>
    </div>
  </header>

  <div class="grid">
    <section class="card">
      <h2>Udstyr <small id="gear-note"></small></h2>
      <div class="doll" id="doll"></div>
    </section>

    <section class="card">
      <h2>Næste skridt <small>Dwarf Shaman</small></h2>
      <div id="quests"></div>
    </section>

    <section class="card span2">
      <h2>Opgraderinger fra auktionshuset
        <span class="filters" id="filters">
          <button data-f="now" class="on">Kan bruges nu</button>
          <button data-f="all">Inkl. kommende levels</button>
        </span>
      </h2>
      <div class="scroll" id="upgrades"><div class="empty-msg">Indlæser…</div></div>
      <div class="note" id="market-note"></div>
    </section>

    <section class="card">
      <h2>Stat-prioritet (leveling, Enhancement)</h2>
      <div class="prio" id="prio"></div>
      <div class="note">Rækkefølge fra <a href="https://www.method.gg/wow-forever/wow-forever-shaman-leveling-guide-and-talents" target="_blank" rel="noopener">Method.gg</a>. Vægtene bruges til at score AH-forslag og kan rettes i <code>config.json</code>.</div>
    </section>

    <section class="card">
      <h2>Egne mål <small id="goal-count"></small></h2>
      <ul class="check" id="goals"></ul>
      <form class="add" id="goal-form">
        <input id="goal-input" placeholder="Tilføj mål…" required>
        <button>Tilføj</button>
      </form>
    </section>
  </div>

  <footer id="footer"></footer>
</div>

<script>
const LEFT  = ['HEAD','NECK','SHOULDER','BACK','CHEST','SHIRT','TABARD','WRIST'];
const RIGHT = ['HANDS','WAIST','LEGS','FEET','FINGER_1','FINGER_2','TRINKET_1','TRINKET_2'];
const BOTTOM = ['MAIN_HAND','OFF_HAND','RANGED'];
const SLOT_DA = { HEAD:'Hoved', NECK:'Hals', SHOULDER:'Skuldre', BACK:'Kappe', CHEST:'Bryst', SHIRT:'Skjorte', TABARD:'Tabard', WRIST:'Håndled',
  HANDS:'Hænder', WAIST:'Bælte', LEGS:'Ben', FEET:'Fødder', FINGER_1:'Ring 1', FINGER_2:'Ring 2', TRINKET_1:'Trinket 1', TRINKET_2:'Trinket 2',
  MAIN_HAND:'Main hand', OFF_HAND:'Off hand', RANGED:'Ranged', FINGER:'Ring', TRINKET:'Trinket' };
const STAT_DA = { STRENGTH:'Str', AGILITY:'Agi', STAMINA:'Sta', INTELLECT:'Int', SPIRIT:'Spi' };
const IGNORE_EMPTY = new Set(['SHIRT','TABARD','RANGED']);

let CFG = { wowheadItemUrl: 'https://www.wowhead.com/forever/item=' };
let upgradeFilter = 'now';
let MARKET = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const getJson = (u) => fetch(u + '?t=' + Date.now()).then((r) => r.ok ? r.json() : null).catch(() => null);
const itemUrl = (id) => id ? CFG.wowheadItemUrl + id : null;

function money(c) {
  const g = Math.floor(c / 10000), s = Math.floor(c % 10000 / 100), cc = c % 100;
  return [g && `<span class="g">${g}g</span>`, (g || s) && `<span class="s">${s}s</span>`, !g && `<span class="c">${cc}c</span>`].filter(Boolean).join(' ');
}
function statStr(u) {
  const parts = Object.entries(u.stats || {}).map(([k, v]) => `+${v} ${STAT_DA[k] || k.toLowerCase()}`);
  if (u.dps) parts.push(`${u.dps.toFixed(1)} dps`);
  if (u.armor) parts.push(`${u.armor} armor`);
  return parts.join(', ');
}

function slotHtml(item, slot) {
  if (!item) return `<div class="slot empty"><div class="ic"></div><div class="t"><div class="n">Tom</div><div class="s">${SLOT_DA[slot] || slot}</div></div></div>`;
  const href = itemUrl(item.id);
  const tag = href ? `a href="${href}" target="_blank" rel="noopener"` : 'div';
  return `<${tag} class="slot q-${esc(item.quality)}" title="${esc(item.name)}">
      <div class="ic" style="background-image:url('${esc(item.icon || '')}')"></div>
      <div class="t"><div class="n">${esc(item.name)}</div><div class="s">${esc(item.slotName || SLOT_DA[slot] || '')}${item.ilvl ? ' · ilvl ' + item.ilvl : ''}</div></div>
    </${tag.split(' ')[0]}>`;
}

function renderCharacter(d) {
  const p = d.profile || {};
  $('name').innerHTML = `${esc(p.name || 'Fabi')} <span class="sur">${esc(p.surname || '')}</span>`;
  $('sub').innerHTML = [
    `<b>${esc(p.level ?? '?')}</b> ${esc(p.race || '')} <span style="color:var(--shaman)">${esc(p.class || '')}</span>`,
    p.guild && `<span class="guild">&lt;${esc(p.guild)}&gt;</span>`,
    p.ruleset?.name && esc(p.ruleset.name),
    p.faction && esc(p.faction),
  ].filter(Boolean).join(' · ');
  $('k-level').textContent = p.level ?? '–';
  $('k-ilvl').textContent = p.equippedItemLevel ?? p.averageItemLevel ?? '–';
  if (d.media?.avatar) $('avatar').style.backgroundImage = `url('${d.media.avatar}')`;

  const eq = d.equipment || [];
  const bySlot = Object.fromEntries(eq.filter((e) => e.slot).map((e) => [e.slot, e]));
  const model = d.media?.main || 'fabi.png';
  if (eq.length && !eq.some((e) => e.slot)) {
    // fallback-data uden slots: vis som liste
    $('doll').innerHTML = `<div class="col" style="grid-column:1/-1">${eq.map((e) => slotHtml(e, '')).join('')}</div>`;
  } else {
    $('doll').innerHTML = `
      <div class="col l">${LEFT.map((s) => slotHtml(bySlot[s], s)).join('')}</div>
      <div class="model" style="background-image:url('${esc(model)}')"></div>
      <div class="col r">${RIGHT.map((s) => slotHtml(bySlot[s], s)).join('')}</div>
      <div class="bottom">${BOTTOM.map((s) => slotHtml(bySlot[s], s)).join('')}</div>
      ${eq.some((e) => !e.slot) ? `<div class="bottom">${eq.filter((e) => !e.slot).map((e) => slotHtml({ ...e, slotName: 'Ukendt slot' }, '')).join('')}</div>` : ''}`;
  }
  const empty = [...LEFT, ...RIGHT, ...BOTTOM].filter((s) => !bySlot[s] && !IGNORE_EMPTY.has(s));
  $('gear-note').textContent = empty.length ? `${empty.length} tomme slots` : '';
  $('footer').innerHTML = `Opdateret ${new Date(d.last_updated).toLocaleString('da-DK')} · kilde: ${d.source === 'api' ? 'Battle.net API' : 'Armory-scrape (fallback)'}
    · <a href="https://worldofwarcraft.blizzard.com/en-us/forever/eu/armory/character/fabi-stormhammer" target="_blank" rel="noopener">Armory</a>`;
}

const QDONE_KEY = 'fabi_forever_quests_done';
const manualDone = () => { try { return JSON.parse(localStorage.getItem(QDONE_KEY)) || {}; } catch { return {}; } };
let QUESTS = null, CHAR = null;
function renderQuests(q = QUESTS, d = CHAR) {
  QUESTS = q; CHAR = d;
  const level = d?.profile?.level ?? 0;
  const done = new Set((d?.completed_quests || []).map((x) => x.name.toLowerCase()));
  const known = d?.completed_quests != null;
  const manual = manualDone();
  const rows = q.items.map((it) => {
    const apiDone = (it.match || []).some((m) => done.has(m.toLowerCase()));
    const isDone = apiDone || !!manual[it.id];
    const state = isDone ? 'done' : level >= it.minLevel ? 'ready' : level + 5 >= it.minLevel ? 'soon' : 'later';
    return { ...it, state, apiDone };
  }).filter((it) => it.state !== 'later' || it.minLevel <= level + 15);
  const order = { ready: 0, soon: 1, later: 2, done: 3 };
  rows.sort((a, b) => order[a.state] - order[b.state] || a.minLevel - b.minLevel);
  $('quests').innerHTML = rows.map((it) => `
    <div class="quest ${it.state}">
      <div class="lv">${it.minLevel}</div>
      <div>
        <div class="qt"><label class="qchk" title="Markér som lavet"><input type="checkbox" data-q="${esc(it.id)}" ${it.state === 'done' ? 'checked' : ''} ${it.apiDone ? 'disabled' : ''}></label>${esc(it.title)}<span class="tag">${it.type === 'quest' ? 'quest' : 'milepæl'}</span></div>
        <div class="qd">${esc(it.where)}${it.reward ? ' · <i>' + esc(it.reward) + '</i>' : ''}
          ${it.warning ? `<span class="warn">⚠ ${esc(it.warning)}</span>` : ''}
          <a href="${esc(it.source)}" target="_blank" rel="noopener">kilde</a></div>
      </div>
    </div>`).join('') +
    (known ? '' : `<div class="note">Gennemførte quests kunne ikke hentes fra API'et. Sæt flueben ved det, du har lavet (gemmes i denne browser).</div>`);
}
document.getElementById('quests').addEventListener('change', (e) => {
  const id = e.target.dataset.q; if (!id) return;
  const m = manualDone(); if (e.target.checked) m[id] = true; else delete m[id];
  try { localStorage.setItem(QDONE_KEY, JSON.stringify(m)); } catch {}
  renderQuests();
});

function renderUpgrades() {
  const m = MARKET;
  if (!m) { $('upgrades').innerHTML = '<div class="empty-msg">market.json findes ikke endnu – kør workflowet.</div>'; return; }
  if (m.error) { $('upgrades').innerHTML = `<div class="empty-msg">Ingen AH-data: ${esc(m.error)}</div>`; }
  const list = (m.upgrades || []).filter((u) => upgradeFilter === 'all' || u.usableNow);
  $('k-up').textContent = (m.upgrades || []).filter((u) => u.usableNow).length;
  const houses = Object.fromEntries((m.houses || []).map((h) => [h.id, h.name]));
  if (!m.error) {
    $('upgrades').innerHTML = list.length ? `<table>
      <thead><tr><th>Item</th><th>Slot</th><th>Krav</th><th class="num">Score</th><th>Erstatter</th><th class="num">Pris</th></tr></thead>
      <tbody>${list.map((u) => `<tr>
        <td><a class="itm q-${esc(u.quality)}" href="${itemUrl(u.id)}" target="_blank" rel="noopener">
          <div class="ic" style="background-image:url('${esc(u.icon || '')}')"></div>
          <div><div class="qn q-${esc(u.quality)}" style="font-weight:600">${esc(u.name)}</div><div class="stats">${esc(statStr(u))}</div></div></a></td>
        <td>${esc(SLOT_DA[u.slotGroup] || u.slotGroup)}</td>
        <td><span class="badge ${u.usableNow ? 'now' : ''}">${u.usableNow ? 'Nu' : 'Lvl ' + u.requiredLevel}</span></td>
        <td class="num"><span class="delta">+${u.delta}</span></td>
        <td class="stats">${esc(u.current?.name || 'tom slot')}</td>
        <td class="num">${money(u.price.copper)}<div class="stats">${esc(houses[u.price.houseId] || '#' + u.price.houseId)} · ${u.price.listings} stk</div></td>
      </tr>`).join('')}</tbody></table>`
      : '<div class="empty-msg">Ingen opgraderinger fundet inden for prisloftet.</div>';
  }
  const nH = (m.houses || []).length;
  $('market-note').innerHTML = m.last_updated ? `Scannet ${new Date(m.last_updated).toLocaleString('da-DK')} · ${nH} auktionshus${nH === 1 ? '' : 'e'} · ${m.scannedItems ?? 0} unikke items
    ${m.unknownItems ? ` (${m.unknownItems} uden data i API'et og derfor udeladt)` : ''}.
    Score er en vægtet sum af stats – en tommelfingerregel, ikke en simulering.
    ${nH > 1 ? ' Flere huse matcher filteret; tjek at prisen er fra dit eget AH, eller lås det i <code>config.json</code> → <code>auction.houseIds</code>.' : ''}` : '';
}

function renderPrio(m) {
  const w = m?.weights || { AGILITY: 1, STRENGTH: .9, STAMINA: .5, INTELLECT: .25 };
  const names = { AGILITY: 'Agility', STRENGTH: 'Strength', STAMINA: 'Stamina', INTELLECT: 'Intellect', SPIRIT: 'Spirit' };
  $('prio').innerHTML = Object.entries(w).filter(([k]) => names[k]).sort((a, b) => b[1] - a[1])
    .map(([k]) => `<span>${names[k]}</span>`).join('<i>›</i>');
}

// Egne mål (gemmes lokalt i browseren)
const GOAL_KEY = 'fabi_forever_goals';
const goals = () => { try { return JSON.parse(localStorage.getItem(GOAL_KEY)) || []; } catch { return []; } };
const saveGoals = (g) => { try { localStorage.setItem(GOAL_KEY, JSON.stringify(g)); } catch {} renderGoals(); };
function renderGoals() {
  const g = goals();
  $('goal-count').textContent = g.length ? `${g.filter((x) => x.done).length}/${g.length}` : '';
  $('goals').innerHTML = g.map((x, i) => `<li class="${x.done ? 'done' : ''}">
      <input type="checkbox" data-i="${i}" ${x.done ? 'checked' : ''}><span>${esc(x.text)}</span><button data-del="${i}" title="Slet">×</button></li>`).join('');
}
$('goals').addEventListener('click', (e) => {
  const g = goals();
  if (e.target.dataset.i !== undefined) { g[e.target.dataset.i].done = e.target.checked; saveGoals(g); }
  if (e.target.dataset.del !== undefined) { g.splice(e.target.dataset.del, 1); saveGoals(g); }
});
$('goal-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const v = $('goal-input').value.trim(); if (!v) return;
  saveGoals([...goals(), { text: v, done: false }]); $('goal-input').value = '';
});
$('filters').addEventListener('click', (e) => {
  if (!e.target.dataset.f) return;
  upgradeFilter = e.target.dataset.f;
  [...$('filters').children].forEach((b) => b.classList.toggle('on', b === e.target));
  renderUpgrades();
});

(async () => {
  const [cfg, ch, mk, q] = await Promise.all([getJson('config.json'), getJson('data/character.json'), getJson('data/market.json'), getJson('quests.json')]);
  if (cfg) CFG = cfg;
  if (ch) renderCharacter(ch); else $('sub').textContent = 'data/character.json mangler – kør workflowet under Actions.';
  if (q) renderQuests(q, ch);
  MARKET = mk; renderUpgrades(); renderPrio(mk);
  renderGoals();
})();
</script>
